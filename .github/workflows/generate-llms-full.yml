name: Generate llms-full.txt and Sync LLM Context

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'llms.txt'

jobs:
  build-llms-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build llms-full.txt
        run: |
          echo "# Full Knowledge Base Context by Borys Kirp" > llms-full.txt
          echo "" >> llms-full.txt
          echo "Last Updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> llms-full.txt
          echo "" >> llms-full.txt
          echo "This file contains the complete consolidated knowledge base text for AI direct intake." >> llms-full.txt
          echo "" >> llms-full.txt

          for file in docs/*; do
            if [ -f "$file" ]; then
              echo "---" >> llms-full.txt
              echo "## File: $(basename "$file")" >> llms-full.txt
              echo "URL: https://boriskirp.github.io/my-knowledge-base/$file" >> llms-full.txt
              echo "" >> llms-full.txt
              cat "$file" >> llms-full.txt
              echo "" >> llms-full.txt
              echo "" >> llms-full.txt
            fi
          done

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add llms-full.txt
          if git diff --staged --quiet; then
            echo "No changes in llms-full.txt"
          else
            git commit -m "auto(ci): update llms-full.txt context [skip ci]"
            git push
          fi
